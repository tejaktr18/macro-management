AWSTemplateFormatVersion: '2010-09-09'
Description: >
  One-time setup per AWS account: lets GitHub Actions deploy PROTOCOL with
  short-lived OIDC credentials (no access keys stored in GitHub).
  The GitHub role can only drive CloudFormation and upload code; CloudFormation
  does the actual resource changes through CfnExecRole.

Parameters:
  GitHubRepo:
    Type: String
    Default: tejaktr18/macro-management
  GitHubEnvironment:
    Type: String
    Default: isengard
    Description: GitHub environment name allowed to assume the role
  AppName:
    Type: String
    Default: protocol
  CreateOidcProvider:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'true'
    Description: Set false if this account already has token.actions.githubusercontent.com

Conditions:
  MakeProvider: !Equals [!Ref CreateOidcProvider, 'true']

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: MakeProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  # Role CloudFormation assumes to create/update the stacks' resources.
  CfnExecRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: cloudformation.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/AdministratorAccess'

  # Role GitHub Actions assumes. Narrow: CloudFormation + code upload + PassRole.
  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - MakeProvider
                - !Ref GitHubOidcProvider
                - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub 'repo:${GitHubRepo}:environment:${GitHubEnvironment}'
      Policies:
        - PolicyName: deploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: Stacks
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:GetTemplateSummary
                Resource:
                  - !Sub 'arn:${AWS::Partition}:cloudformation:*:${AWS::AccountId}:stack/${AppName}/*'
                  - !Sub 'arn:${AWS::Partition}:cloudformation:*:${AWS::AccountId}:stack/${AppName}-bootstrap/*'
                  - !Sub 'arn:${AWS::Partition}:cloudformation:*:aws:transform/Serverless-2016-10-31'
              - Sid: UploadCode
                Effect: Allow
                Action: s3:PutObject
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${AppName}-bootstrap-artifactbucket-*/api/*'
              - Sid: PassToCfn
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt CfnExecRole.Arn
              - Sid: Whoami
                Effect: Allow
                Action: sts:GetCallerIdentity
                Resource: '*'

Outputs:
  DeployRoleArn:
    Description: GitHub environment variable AWS_DEPLOY_ROLE_ARN
    Value: !GetAtt GitHubDeployRole.Arn
  CfnExecRoleArn:
    Description: GitHub environment variable CFN_EXEC_ROLE_ARN
    Value: !GetAtt CfnExecRole.Arn
